<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="t d">
  <title id="t">Turn step three — you both change it</title>
  <desc id="d">The offer was taken. A solid pigment trace runs where the dashed one was, the clay carries a new pressed dent, and both the hand and the gripper are still on the material.</desc>
  <defs>
    <pattern id="dots3" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#D8D8D3"/></pattern>
  </defs>
  <rect width="720" height="460" fill="#FCFCFA"/>
  <rect width="720" height="460" fill="url(#dots3)"/>

  <g stroke="#232322" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 材料变了：这一回合真的留下了东西 -->
    <path d="M 268 390 Q 254 318 302 294 Q 330 276 348 302 Q 368 330 396 296 Q 452 322 442 390 Z" fill="#D8D8D3"/>
    <path d="M 400 350 Q 424 344 440 354" fill="none" stroke-width="5"/>
    <line x1="20" y1="390" x2="700" y2="390" stroke-width="10"/>

    <!-- 两只「手」都还在材料上 -->
    <path d="M 0 258 L 196 306" fill="none" stroke-width="48"/>
    <path d="M 0 258 L 196 306" fill="none" stroke="#EBEBE7" stroke-width="34"/>
    <path d="M 198 274 L 244 274 Q 262 274 262 290 L 310 320 Q 316 326 310 332 L 258 318
             Q 262 338 244 342 L 200 342 Q 186 342 186 308 Q 186 274 198 274 Z" fill="#EBEBE7"/>

    <line x1="716" y1="66" x2="520" y2="200" stroke-width="34"/>
    <line x1="716" y1="66" x2="520" y2="200" stroke="#EBEBE7" stroke-width="21"/>
    <circle cx="716" cy="66" r="32" fill="#EBEBE7"/>
    <circle cx="716" cy="66" r="13" fill="none" stroke="#1052CC" stroke-width="9"/>
    <circle cx="520" cy="200" r="20" fill="#EBEBE7"/>
    <line x1="520" y1="200" x2="474" y2="220" stroke-width="17"/>
    <line x1="520" y1="200" x2="488" y2="248" stroke-width="17"/>
  </g>

  <!-- 走过的那一下：全饱和颜料，直接画在工作面上 -->
  <path d="M 484 244 Q 410 268 340 314" fill="none" stroke="#1052CC" stroke-width="15" stroke-linecap="round"/>
  <circle cx="330" cy="322" r="15" fill="#F7C600" stroke="#232322" stroke-width="8"/>
  <g stroke="#232322" stroke-width="8" stroke-linecap="round">
    <line x1="372" y1="266" x2="372" y2="236"/>
    <line x1="330" y1="272" x2="308" y2="248"/>
    <line x1="414" y1="278" x2="436" y2="254"/>
  </g>
</svg>
