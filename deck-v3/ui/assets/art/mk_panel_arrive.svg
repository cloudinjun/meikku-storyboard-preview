<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Player two takes the seat</title>
  <desc id="d">The same work table. A Meikku arm now fills the opposite seat, its gripper working the same lump of clay as the person's hand, with a pigment action trace, a contact marker, and three impact rays marking the shared move.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#D8D8D3"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#FCFCFA"/>
  <rect width="1200" height="700" fill="url(#dots)"/>

  <g stroke="#232322" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">

    <line x1="40" y1="670" x2="1160" y2="670"/>

    <!-- 人：同一姿态，同一位置 -->
    <line x1="272" y1="558" x2="258" y2="668" stroke-width="13"/>
    <line x1="364" y1="558" x2="378" y2="668" stroke-width="13"/>
    <rect x="252" y="534" width="132" height="24" fill="#EBEBE7"/>

    <path d="M 352 528 L 452 548 L 458 648" fill="none" stroke-width="42"/>
    <path d="M 352 528 L 452 548 L 458 648" fill="none" stroke="#EBEBE7" stroke-width="28"/>
    <path d="M 458 648 L 512 652" fill="none" stroke-width="30"/>
    <path d="M 458 648 L 508 652" fill="none" stroke="#EBEBE7" stroke-width="16"/>

    <path d="M 300 540 L 306 420 Q 308 388 342 384 Q 380 382 386 416 L 398 540 Z" fill="#EBEBE7"/>

    <rect x="330" y="352" width="34" height="42" fill="#EBEBE7"/>
    <circle cx="347" cy="318" r="52" fill="#EBEBE7"/>
    <path d="M 293 320 Q 291 260 347 260 Q 403 260 401 320 L 385 320 Q 385 288 347 288 Q 309 288 309 320 Z" fill="#232322"/>
    <circle cx="379" cy="314" r="7" fill="#232322" stroke="none"/>
    <path d="M 369 340 Q 381 352 392 336" fill="none" stroke-width="5"/>

    <path d="M 386 414 L 452 452 L 536 442" fill="none" stroke-width="36"/>
    <path d="M 386 414 L 452 452 L 536 442" fill="none" stroke="#EBEBE7" stroke-width="22"/>
    <circle cx="546" cy="440" r="20" fill="#EBEBE7"/>

    <!-- 工作台 -->
    <line x1="200" y1="474" x2="200" y2="668" stroke-width="16"/>
    <line x1="1000" y1="474" x2="1000" y2="668" stroke-width="16"/>
    <rect x="120" y="446" width="960" height="28" fill="#EBEBE7"/>

    <!-- 泥：被两个人一起改过，顶上多了一道压痕 -->
    <path d="M 552 446 Q 542 396 578 382 Q 616 366 636 396 Q 642 406 650 400 L 656 446 Z" fill="#D8D8D3"/>

    <!-- Meikku：坐进了对面那个位置 -->
    <line x1="848" y1="558" x2="834" y2="668" stroke-width="13"/>
    <line x1="940" y1="558" x2="954" y2="668" stroke-width="13"/>
    <rect x="828" y="534" width="132" height="24" fill="#EBEBE7"/>

    <path d="M 852 446 L 868 394 L 936 394 L 952 446 Z" fill="#EBEBE7"/>
    <line x1="902" y1="394" x2="838" y2="286" stroke-width="34"/>
    <line x1="902" y1="394" x2="838" y2="286" stroke="#EBEBE7" stroke-width="20"/>
    <line x1="838" y1="286" x2="706" y2="372" stroke-width="30"/>
    <line x1="838" y1="286" x2="706" y2="372" stroke="#EBEBE7" stroke-width="18"/>
    <circle cx="902" cy="394" r="24" fill="#EBEBE7"/>
    <circle cx="838" cy="286" r="27" fill="#EBEBE7"/>
    <circle cx="838" cy="286" r="11" fill="none" stroke="#1052CC" stroke-width="8"/>
    <circle cx="706" cy="372" r="17" fill="#EBEBE7"/>
    <line x1="706" y1="372" x2="660" y2="350" stroke-width="15"/>
    <line x1="706" y1="372" x2="662" y2="400" stroke-width="15"/>
  </g>

  <!-- 动作轨迹：全饱和颜料，直接画在工作面上 -->
  <path d="M 668 366 Q 626 316 570 350" fill="none" stroke="#1052CC" stroke-width="13" stroke-linecap="round"/>
  <circle cx="570" cy="350" r="13" fill="#F7C600" stroke="#232322" stroke-width="6"/>

  <!-- 三道撞击射线：沿用 logo 的相遇手势 -->
  <g stroke="#232322" stroke-width="9" stroke-linecap="round">
    <line x1="608" y1="322" x2="608" y2="282"/>
    <line x1="562" y1="330" x2="534" y2="300"/>
    <line x1="654" y1="330" x2="682" y2="300"/>
  </g>
</svg>
