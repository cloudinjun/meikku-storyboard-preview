<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="t d">
  <title id="t">Turn step one — you point</title>
  <desc id="d">A hand reaches in and points at one spot on the shared lump of clay. A yellow contact marker sits on the place both partners are now looking at.</desc>
  <defs>
    <pattern id="dots1" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#D8D8D3"/></pattern>
  </defs>
  <rect width="720" height="460" fill="#FCFCFA"/>
  <rect width="720" height="460" fill="url(#dots1)"/>

  <g stroke="#232322" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 268 390 Q 254 318 302 294 Q 350 268 398 294 Q 452 322 442 390 Z" fill="#D8D8D3"/>
    <line x1="20" y1="390" x2="700" y2="390" stroke-width="10"/>

    <!-- 一只手，指着一个具体的地方 -->
    <path d="M 0 258 L 196 306" fill="none" stroke-width="48"/>
    <path d="M 0 258 L 196 306" fill="none" stroke="#EBEBE7" stroke-width="34"/>
    <path d="M 198 274 L 244 274 Q 262 274 262 290 L 310 320 Q 316 326 310 332 L 258 318
             Q 262 338 244 342 L 200 342 Q 186 342 186 308 Q 186 274 198 274 Z" fill="#EBEBE7"/>

    <!-- Meikku 收着手在看：这一手不归它 -->
    <line x1="716" y1="40" x2="586" y2="132" stroke-width="34"/>
    <line x1="716" y1="40" x2="586" y2="132" stroke="#EBEBE7" stroke-width="21"/>
    <circle cx="716" cy="40" r="32" fill="#EBEBE7"/>
    <circle cx="716" cy="40" r="13" fill="none" stroke="#1052CC" stroke-width="9"/>
    <circle cx="586" cy="132" r="20" fill="#EBEBE7"/>
    <line x1="586" y1="132" x2="556" y2="106" stroke-width="17"/>
    <line x1="586" y1="132" x2="548" y2="146" stroke-width="17"/>
  </g>

  <!-- 接触点：先有共同的「这里」，才谈得上一起做 -->
  <circle cx="330" cy="322" r="15" fill="#F7C600" stroke="#232322" stroke-width="8"/>
  <g stroke="#232322" stroke-width="7" stroke-linecap="round">
    <line x1="330" y1="284" x2="330" y2="260"/>
    <line x1="296" y1="294" x2="278" y2="274"/>
    <line x1="364" y1="294" x2="382" y2="274"/>
  </g>
</svg>
