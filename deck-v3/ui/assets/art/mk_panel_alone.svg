    <path d="M 852 446 L 868 394 L 936 394 L 952 446 Z"/>
    <polygon points="916.6,385.3 852.6,277.3 823.4,294.7 887.4,402.7"/>
    <polygon points="846.2,298.6 714.2,384.6 697.8,359.4 829.8,273.4"/>
    <circle cx="902" cy="394" r="24"/>
    <circle cx="838" cy="286" r="27"/>
    <circle cx="706" cy="372" r="17"/>
    <polygon points="702,364 658,342 654,358 700,380"/>
    <polygon points="700,364 656,392 664,408 708,380"/>
  </g>

  <g stroke="#232322" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">

    <line x1="40" y1="670" x2="1160" y2="670"/>

    <!-- 人：一个人坐在这里 -->
