<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Waiting for player two</title>
  <desc id="d">A person sits alone at a work table with an untouched lump of clay. The seat across from them is empty, and the shape of a Meikku arm appears only as a pale absent silhouette.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#D8D8D3"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#FCFCFA"/>
  <rect width="1200" height="700" fill="url(#dots)"/>

  <!-- 缺席的玩伴：只剩一个没人的形状，不描边、不打光 -->
